name: Daily data refresh

on:
  schedule:
    - cron: "23 21 * * *"   # every day, 21:23 UTC (early morning in China, after the day's releases)
  workflow_dispatch: {}      # also lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest drama data
        run: python scripts/update.py
      - name: Save changes
        run: |
          git config user.name "cdrama-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache docs/data
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily data refresh"
            git push
          fi
